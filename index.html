<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VectorFieldCompare Prototype</title>
<style>
body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:12px;color:#222}
#drop{border:2px dashed #bbb;padding:18px;text-align:center;border-radius:8px}
canvas{border:1px solid #ddd;margin:8px 0;width:100%;height:240px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
select,input,button{padding:6px}
.summary{font-size:90%;color:#444}
</style>
</head>
<body>
<h2>VectorFieldCompare — prototype</h2>
<div id="drop">Drop CSV/JSON files here or <input id="file" type="file" multiple></div>
<div class="controls">
<select id="timeTolerance"><option value="0.05">Tolerance: 50 ms</option><option value="0.1">100 ms</option><option value="0.5">500 ms</option><option value="1">1 s</option></select>
<button id="align">Align & Visualize</button>
<button id="export">Export synchronized CSV</button>
</div>
<div class="summary" id="summary">No data loaded.</div>
<canvas id="field"></canvas>
<canvas id="timeseries"></canvas>
<script>
// Small helper parser for CSV
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
  const hdr = lines.shift().split(/,|\t/).map(h=>h.trim());
  return lines.map(l=>{
    const cols = l.split(/,|\t/).map(c=>c.trim());
    const obj = {};
    hdr.forEach((h,i)=> obj[h]=cols[i]);
    return obj;
  });
}

let records = []; // {t,type,x,y,z}

function loadObjects(objs){
  for(const o of objs){
    const t = parseFloat(o.timestamp ?? o.time ?? o.t);
    const type = (o.type||o.label||'unk').toString();
    const x = parseFloat(o.x);
    const y = parseFloat(o.y);
    const z = parseFloat(o.z);
    if(Number.isFinite(t) && Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z)){
      records.push({t,type,x,y,z});
    }
  }
  document.getElementById('summary').textContent = `Loaded ${records.length} vector rows.`;
}

// File handling
const fileInput = document.getElementById('file');
fileInput.addEventListener('change', e=>{
  handleFiles(Array.from(e.target.files));
});
const drop = document.getElementById('drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor='#888'}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor='#bbb'}));
drop.addEventListener('drop', e=>{ handleFiles(Array.from(e.dataTransfer.files)); });

function handleFiles(files){
  const readers = files.map(f=>new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res({name:f.name, text:r.result}); r.onerror=()=>rej();
    r.readAsText(f);
  }));
  Promise.all(readers).then(list=>{
    for(const f of list){
      if(f.name.match(/\.json$/i)){
        try{ loadObjects(JSON.parse(f.text)); }catch(e){console.error(e)}
      } else {
        try{ const objs = parseCSV(f.text); loadObjects(objs); }catch(e){console.error(e)}
      }
    }
  });
}

// Alignment: group by nearest timestamp within tolerance (seconds)
function align(tol){
  if(records.length===0) return [];
  const byType = {};
  for(const r of records) byType[r.type] = (byType[r.type]||[]).concat(r);
  for(const k in byType) byType[k].sort((a,b)=>a.t-b.t);
  // pick union of timestamps from all types, then for each timestamp collect nearest
  const allT = Array.from(new Set(records.map(r=>r.t))).sort((a,b)=>a-b);
  const rows=[];
  for(const t of allT){
    const row={t};
    let has=false;
    for(const k in byType){
      // find nearest
      let best=null; let bestD=Infinity;
      const arr=byType[k];
      // simple linear scan -- small data expected
      for(const e of arr){ const d=Math.abs(e.t-t); if(d<bestD){bestD=d;best=e;} }
      if(bestD<=tol){ row[k]=best; has=true } else row[k]=null;
    }
    if(has) rows.push(row);
  }
  return rows;
}

// Simple drawing: 2D projection XY for vector field
function drawField(rows){
  const c=document.getElementById('field'); c.width=c.clientWidth; c.height=240;
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
  // draw axes
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#eee'; for(let i=0;i<5;i++){const x=i*c.width/4;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
  // collect vectors per type
  const types = Object.keys(records.reduce((s,r)=>{s[r.type]=1;return s},{}));
  const colors=['#d65a31','#2b7fb2','#7aa05b'];
  const scale=20;
  // layout: rows horizontally
  const n = Math.min(rows.length, 60);
  for(let i=0;i<n;i++){
    const row=rows[i];
    const cx = 20 + i*(c.width-40)/n;
    const cy = c.height/2;
    for(let j=0;j<types.length;j++){
      const t=types[j]; const rec = row[t]; if(!rec) continue;
      const vx = rec.x*scale; const vy = -rec.y*scale;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+vx,cy+vy);
      ctx.strokeStyle = colors[j%colors.length]; ctx.lineWidth=2; ctx.stroke();
      // arrowhead
      const ang=Math.atan2(vy,vx);
      ctx.beginPath(); ctx.moveTo(cx+vx,cy+vy);
      ctx.lineTo(cx+vx-6*Math.cos(ang-0.4), cy+vy-6*Math.sin(ang-0.4));
      ctx.lineTo(cx+vx-6*Math.cos(ang+0.4), cy+vy-6*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fillStyle=colors[j%colors.length]; ctx.fill();
    }
  }
}

// Time series: per-axis lines for first three types
function drawTimeseries(rows){
  const c=document.getElementById('timeseries'); c.width=c.clientWidth; c.height=240;
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  const types = Object.keys(records.reduce((s,r)=>{s[r.type]=1;return s},{}));
  const colors=['#d65a31','#2b7fb2','#7aa05b'];
  const axes=['x','y','z'];
  const padding=30;
  // build per-type per-axis arrays
  for(let ti=0;ti<types.length;ti++){
    const t=types[ti];
    for(let ai=0;ai<axes.length;ai++){
      ctx.beginPath();
      const vals = rows.map(r=> r[t]? r[t][axes[ai]] : null);
      // scale to canvas
      const present = vals.filter(v=>v!==null);
      if(present.length===0) continue;
      const min=Math.min(...present), max=Math.max(...present);
      for(let i=0;i<rows.length;i++){
        const v=vals[i]; if(v===null) continue;
        const x = padding + i*(c.width-2*padding)/(rows.length-1);
        const y = padding + (1 - (v-min)/(max-min||1))*(c.height-2*padding);
        if(i===0||vals.slice(0,i).every(u=>u===null)) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = colors[ti%colors.length]; ctx.lineWidth=1; ctx.stroke();
    }
  }
}

// Export CSV
function exportCSV(rows){
  if(rows.length===0) return;
  const types = Object.keys(records.reduce((s,r)=>{s[r.type]=1;return s},{}));
  const cols=['t'];
  for(const t of types){ cols.push(...[t+'_x',t+'_y',t+'_z']); }
  const lines=[cols.join(',')];
  for(const r of rows){
    const vals=[r.t];
    for(const t of types){ const rec=r[t]; if(rec) vals.push(rec.x,rec.y,rec.z); else vals.push('','',''); }
    lines.push(vals.join(','));
  }
  const blob = new Blob([lines.join('\n')],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='synchronized.csv'; a.click(); URL.revokeObjectURL(url);
}

// Wire buttons
document.getElementById('align').addEventListener('click',()=>{
  const tol = parseFloat(document.getElementById('timeTolerance').value);
  const rows = align(tol);
  if(rows.length===0){ document.getElementById('summary').textContent='No aligned rows.'; return }
  document._lastAligned = rows;
  document.getElementById('summary').textContent = `Aligned ${rows.length} timestamps (tol ${tol}s).`;
  drawField(rows); drawTimeseries(rows);
});

document.getElementById('export').addEventListener('click',()=>{
  const rows = document._lastAligned || [];
  exportCSV(rows);
});
</script>
</body>
</html>
